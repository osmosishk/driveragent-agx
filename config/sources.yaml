# AGX ingest sources (infer/ingest/ingest.py). Paths are absolute or relative to the project root.
#
# mode:
#   sim   FrameLink over UDP from the simulator tools.rk_sim on this AGX. Default.
#         All frames are SIMULATED (R13), also when the source byte says LIVE.
#   rk    FrameLink over UDP from the RK3588. Only frames with source byte LIVE are "live".
#   file  Decode the local recordings below directly. No network. All frames are SIMULATED.
# The environment variable AGX_INGEST_MODE overrides this value.
# Now: rk. The real board DA01 sends on the LAN to 10.0.0.130 (eno1). Link C is not configured.
mode: rk

# Bind address of the six UDP sockets (camera N -> port 6000+N).
#   sim: 127.0.0.1 (loopback only).
#   rk:  0.0.0.0. In the RK design the RK3588 sends to the AGX Link C address 10.42.0.1.
#        Link C (10.42.0.1) is NOT configured on this AGX tonight.
bind_host:
  sim: "127.0.0.1"
  rk: "0.0.0.0"

# rk mode only: accept FrameLink datagrams only from these source IP addresses. Datagrams from
# other addresses are dropped and counted (camera counter foreign_source_drops).
# The same list is the peer allowlist of the RkCameraInfo SUB on port 5564 (infer/rkinfo.py, ZAP; all modes).
#   []  = accept all source addresses. infer.main writes a WARNING line at start.
# The owner sets the RK3588 address:
#   Link C:     rk_allowed_sources: ["10.42.0.2"]
#   tailscale:  rk_allowed_sources: ["100.64.0.180"]
# sim mode: not used (the sockets bind 127.0.0.1).
# Now: DA01 eth0 has both addresses (two DHCP leases). The kernel uses 10.0.0.208 as the source
# toward 10.0.0.130 (`ip route get 10.0.0.130` on DA01 gives `src 10.0.0.208`).
# If DA01 gets a new LAN address, update this list.
rk_allowed_sources: ["10.0.0.208", "10.0.0.209"]

# Camera state (FrameStore): STALE after stale_s without a new frame, NO SIGNAL after no_signal_s.
stale_s: 0.5
no_signal_s: 1.0

# Socket receive buffer in bytes. 0 = the maximum allowed (net.core.rmem_max = 212992; the kernel
# doubles the request). Do not change rmem_max.
rcvbuf_bytes: 0

# rx_process: true = one receive process per camera (socket + reassembly), frames go to this
# process through a shared-memory ring (ring_slots x max_frame_bytes per camera, in /dev/shm:
# 8 x 2 MiB = 16 MiB per camera). A frame larger than max_frame_bytes is rejected (bad).
# The ring holds ring_slots frames (8 = 0.27 s at 30 fps) when this process is late.
# Reason: with rmem_max 212992 B a socket holds only about 25 jumbo datagrams (a few ms of cam0
# NV12). Six receive threads in one Python process share the GIL and the sockets overflow
# (measured: NV12 at 30 fps, cam0 6 fps, UDP RcvbufErrors up). Keep true.
# rx_process: false = one receive thread per camera in this process (only for H.265 or tests).
rx_process: true
ring_slots: 8
max_frame_bytes: 2097152

# Create the H.265 decoders at start (about 0.15 s each). Without this, the first IDR frames can
# be lost while the decoder starts.
decoder_prestart: true

# Python GIL switch interval in s, only for rx_process: false (Python default 0.005; 0.0005
# helps a little). 0 = do not change. Process-wide setting.
gil_switch_interval_s: 0

# A partial frame that gets no fragment for this time WHILE other datagrams arrive is abandoned
# (counted in lost_fragments). A quiet socket (sender pause) does not abandon it.
# A datagram after a quiet socket of this time, or a seq jump back of more than 8 frames, starts a
# new stream (sender restart): it is accepted at once (counter new_streams).
reassembly_timeout_s: 0.2

# H.265: after a lost frame, drop frames until the next IDR or CRA (no corrupted pictures to the
# models). After a sender restart (seq goes back), wait for an IDR with VPS/SPS/PPS.
h265_resync_on_loss: true

# File mode: nominal frame rate. Real pacing follows the file timestamps (the recordings are 30/1).
file_fps: 30

# Six cameras. Roles are from the old stack. port = 6000 + cam (RK design).
# role:    the camera of the old recordings that sim and file mode replay.
# role_rk: optional, used only in rk mode: the DA01 rk-camd section of this FrameLink camera
#          (/etc/driveragent/vehicle/camera_map.ini on DA01). Only cam0 has a CONFIRMED role.
#          Schema v2: DA01 sends the camera names and roles (RkCameraInfo, port 5564). While that info is
#          fresh (last 3 s) the status uses the DA01 name and role (infoSource "rk"); role_rk is only the
#          fallback when no DA01 info came (infoSource "config").
#          The DA01 sender maps FrameLink cam1..cam5 to the connectors CAM2..CAM6 in this order.
# files: used only in file mode. Each entry is a path or a glob pattern. The list loops.
# The recordings are READ-ONLY input (H.265 Main, 1280x720, 30 fps, about 58.5 s per file).
# Four consecutive sessions per camera = about 4 minutes before the loop starts again.
cameras:
  - cam: 0
    role: front
    role_rk: "front"
    port: 6000
    files:
      - /home/tonyho/driveragent/logger/video/8003-20260510_150920/front/cam0_*.mp4
      - /home/tonyho/driveragent/logger/video/8003-20260510_151020/front/cam0_*.mp4
      - /home/tonyho/driveragent/logger/video/8003-20260510_151120/front/cam0_*.mp4
      - /home/tonyho/driveragent/logger/video/8003-20260510_151220/front/cam0_*.mp4
  - cam: 1
    role: right
    role_rk: "fisheye-190 CAM2"
    port: 6001
    files:
      - /home/tonyho/driveragent/logger/video/8003-20260510_150920/right/cam1_*.mp4
      - /home/tonyho/driveragent/logger/video/8003-20260510_151020/right/cam1_*.mp4
      - /home/tonyho/driveragent/logger/video/8003-20260510_151120/right/cam1_*.mp4
      - /home/tonyho/driveragent/logger/video/8003-20260510_151220/right/cam1_*.mp4
  - cam: 2
    role: left
    role_rk: "CAM3"
    port: 6002
    files:
      - /home/tonyho/driveragent/logger/video/8003-20260510_150920/left/cam2_*.mp4
      - /home/tonyho/driveragent/logger/video/8003-20260510_151020/left/cam2_*.mp4
      - /home/tonyho/driveragent/logger/video/8003-20260510_151120/left/cam2_*.mp4
