# agx02 dashboard (read-only). Paths are relative to the project root.
port: 8700                 # if in use, the next free port is used (8701, ...)
port_file: data/dashboard_port
bind: "0.0.0.0"            # IPv4, all interfaces. Access is limited by allow_cidrs and HTTP Basic auth.
env_file: .env             # AGX_DASH_USER / AGX_DASH_PASSWORD / AGX_MQTT_*
# Plain HTTP + Basic auth: the password crosses the network on every request (also on SSE
# reconnects). Use the page through tailscale (100.64.0.0/10) or loopback. Optional TLS: set both
# files (PEM) and the page is served as https.
tls_certfile: null
tls_keyfile: null

# IP allowlist. The password is still needed from every address. IPv4 only: the socket is IPv4
# (bind 0.0.0.0), so IPv6 entries have no effect. Not allowed: docker bridges (172.16.0.0/12,
# includes docker0), 192.168.0.0/16 and link-local 169.254.0.0/16.
allow_cidrs:
  - 127.0.0.0/8            # loopback
  - 10.0.0.0/24            # eno1 LAN
  - 10.42.0.0/30           # future Link C (direct cable to the RK3588)
  - 100.64.0.0/10          # tailscale tailnet: the RK3588 and the operator devices

# DA01 LAN source address toward 10.0.0.130 (FrameLink and results use the LAN).
# tailscale 100.64.0.180 was the night-run path.
rk_ip: "10.0.0.208"

link:
  ping_interval_s: 2
  loss_window_s: 60
  clock_method: auto       # auto | http_date | clockdiff | none
  clock_http_port: null    # null = in auto mode, try clock_http_ports_auto
  clock_http_ports_auto: [80, 8080, 8000]
  clock_interval_s: 30

infer_status_endpoint: tcp://127.0.0.1:5562

# Model controller (controller/, docs/MODEL_CONTROL_API.md). The store is not in git. The control token file
# (mode 600, not in git) lets the DA01 rk console server call /api/models/* with "Authorization: Bearer".
# control_mode is in control_config: only the owner changes that file.
model_control: true
model_store: ~/agx-models
control_config: config/control.yaml
control_token_file: data/control.token
model_check_timeout_s: 180
infer_stale_s: 3           # no agx-infer status for this time -> NO DATA (models and cameras)

# Models part: rows come from models_config; camera STALE / NO SIGNAL limits (stale_s, no_signal_s)
# and camera roles come from sources_config when the agx-infer status does not give them.
models_config: config/models.yaml
sources_config: config/sources.yaml
# Camera tiles: frames that came after the last status message are not known. A camera with no
# new frame shows NO SIGNAL when the status says so (age >= no_signal_s), or when the newest known
# frame is older than max(no_signal_s, min(status interval + this jitter, no_signal_s + 0.5)).
# 1 Hz status: 1.0 .. 1.3 s on the server, + up to 0.25 s on the page. Never more than 1.5 s (+ 0.25 s).
camera_status_jitter_s: 0.3

# Engine facts (size, date, sha256[:16], TensorRT load + warnings, I/O) from tools/inspect_engines.py.
# A background thread scans at start and every scan_interval_s. Each engine is read in its own
# subprocess; only new or changed files (realpath + size + mtime) are read again. A FAILED inspection
# (for example a timeout) is done again at the next periodic scan.
engines:
  cache: data/engines_cache.json
  scan_dirs: [/home/tonyho/model]   # also the engines of models_config are always read
  scan_interval_s: 1800
  inspect_timeout_s: 120

docker: true

services:
  agx_units: [agx-dashboard, agx-infer, agx-sim]
  log_units: [agx-infer, agx-dashboard, agx-sim]   # whitelist for /api/services/logs. The system
                                                  # unit is read when it is active, else the user unit.
  unit_refresh_s: 5
  docker_refresh_s: 10
  docker_inspect_cache_s: 30

# Units from the audit (docs/audit/agx_audit_agx02_20261005_210334/raw/
# Custom_systemd_units__created_by_hand_.txt) plus docker.service. The coordinator may edit this list.
old_units:
  # No systemd unit exists for the OLD DriverAgent stack: it starts by hand (~/s.sh -> start.py).
  # Its only autostart item is the Docker container driveragent-valhalla (see "Docker containers").
  # This list shows the units that matter for this inference node and for docs/CLEANUP_PROPOSAL.md.
  - docker.service                       # runs driveragent-valhalla (old map service, MOVE TO RK3588)
  - jtop.service                         # jetson-stats (health data source; KEEP)
  - nvpmodel.service                     # power mode (KEEP)
  - nvfancontrol.service                 # fan (KEEP)
  - nvargus-daemon.service               # CSI camera daemon of JetPack (not used by FrameLink ingest)
  - tailscaled.service                   # path to the RK3588 tonight (KEEP)
  - ssh.service                          # remote access (KEEP)
  - systemd-timesyncd.service            # clock (NTP); no PTP yet
  - gdm.service                          # desktop (proposal: DISABLE)
  - nxserver.service                     # NoMachine remote desktop (proposal: owner decides)
  - openvpn@uk-ovpn-agent-20.service     # VPN; fails TLS handshake now (proposal: owner decides)
  - snap.cups.cupsd.service              # printing (proposal: DISABLE)
  - snapd.service                        # snap daemon (proposal: DISABLE last)
  - packagekit.service                   # package updates (proposal: DISABLE)

history:
  db: data/history.sqlite
  max_mb: 50
  memory_s: 3600           # 1 h at 1 s in memory
  db_step_s: 10            # 24 h at 10 s in SQLite
  db_keep_s: 86400
  cleanup_interval_s: 600

limits:
  temp_c: {warn: 70, crit: 85}
  ram_pct: {warn: 80, crit: 90}
  disk_pct: {warn: 80, crit: 90}

nvpmodel_interval_s: 30
mqtt_interval_s: 5
