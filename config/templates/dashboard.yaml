# AGX dashboard (read-only). Paths are relative to the project root.
# Template: ops/install.sh copies this file to config/dashboard.yaml (only when that file is missing).
# config/dashboard.yaml is machine data and is not in git.

# Name of this unit: the page title, the auth realm "<node_name>-dashboard", the MQTT topic and the power
# log part. null = the short host name of this machine.
node_name: null

port: 8700                 # if in use, the next free port is used (8701, ...)
port_file: data/dashboard_port
bind: "0.0.0.0"            # IPv4, all interfaces. Access is limited by allow_cidrs and HTTP Basic auth.
env_file: .env             # AGX_DASH_USER / AGX_DASH_PASSWORD / AGX_MQTT_*
# Plain HTTP + Basic auth: the password crosses the network on every request (also on SSE
# reconnects). Use the page through a VPN (for example tailscale 100.64.0.0/10) or loopback. Optional TLS: set both
# files (PEM) and the page is served as https.
tls_certfile: null
tls_keyfile: null

# IP allowlist. The password is still needed from every address. IPv4 only: the socket is IPv4
# (bind 0.0.0.0), so IPv6 entries have no effect. Not allowed: docker bridges (172.16.0.0/12,
# includes docker0), 192.168.0.0/16 and link-local 169.254.0.0/16.
# ops/install.sh adds the private IPv4 subnets of this unit (for example the LAN subnet).
allow_cidrs:
  - 127.0.0.0/8            # loopback
  - 10.42.0.0/30           # Link C (direct cable to the RK3588)
  - 100.64.0.0/10          # tailscale tailnet: the RK3588 and the operator devices

# The "RK link" card pings the paired board with the newest last_seen (its last_seen_addr) from
# data/paired_boards.json, the one source of the board addresses on this AGX. The old key rk_ip is not used.

link:
  ping_interval_s: 2
  loss_window_s: 60
  clock_method: auto       # auto | http_date | clockdiff | none
  clock_http_port: null    # null = in auto mode, try clock_http_ports_auto
  clock_http_ports_auto: [80, 8080, 8000]
  clock_interval_s: 30

# The ports of agx-infer come from infer_config (below): null = tcp://127.0.0.1:<ports.internal> (status) and
# tcp://127.0.0.1:<ports.admin> (admin socket of the model controller); 5562 / 5563 when the file has no port.
infer_status_endpoint: null
infer_admin_endpoint: null

# Model controller (controller/, docs/MODEL_CONTROL_API.md). The store is not in git. The control token file
# (mode 600, not in git) is read only by the start-up migration of the old single board token.
# control_mode is in control_config: only the owner changes that file.
model_control: true
model_store: ~/agx-models
control_config: config/control.yaml
control_token_file: data/control.token
infer_config: config/infer.yaml   # ports of agx-infer (pairing info, status and admin endpoints)
model_check_timeout_s: 180
infer_stale_s: 3           # no agx-infer status for this time -> NO DATA (models and cameras)

# Models part: rows come from models_config; camera STALE / NO SIGNAL limits (stale_s, no_signal_s)
# and camera roles come from sources_config when the agx-infer status does not give them.
models_config: config/models.yaml
sources_config: config/sources.yaml
# Folders that no part of this software writes (old engines, old models). The model controller refuses to build
# into them and the model store must not be inside them. Example: [/home/<user>/model].
protected_dirs: []
# Camera tiles: frames that came after the last status message are not known. A camera with no
# new frame shows NO SIGNAL when the status says so (age >= no_signal_s), or when the newest known
# frame is older than max(no_signal_s, min(status interval + this jitter, no_signal_s + 0.5)).
# 1 Hz status: 1.0 .. 1.3 s on the server, + up to 0.25 s on the page. Never more than 1.5 s (+ 0.25 s).
camera_status_jitter_s: 0.3

# Engine facts (size, date, sha256[:16], TensorRT load + warnings, I/O) from tools/inspect_engines.py.
# A background thread scans at start and every scan_interval_s. Each engine is read in its own
# subprocess; only new or changed files (realpath + size + mtime) are read again. A FAILED inspection
# (for example a timeout) is done again at the next periodic scan.
engines:
  cache: data/engines_cache.json
  scan_dirs: []           # more folders to scan, for example [/home/<user>/model]. The engines of
                          # models_config are always read.
  scan_interval_s: 1800
  inspect_timeout_s: 120

docker: true

# Unit names: <unit_prefix>-dashboard, <unit_prefix>-infer, <unit_prefix>-sim (ops/install.sh --instance).
unit_prefix: agx
services:
  # null = made from unit_prefix: agx_units [<p>-dashboard, <p>-infer, <p>-sim],
  # log_units [<p>-infer, <p>-dashboard, <p>-sim]. log_units is the whitelist for /api/services/logs. The
  # system unit is read when it is active, else the user unit.
  agx_units: null
  log_units: null
  unit_refresh_s: 5
  docker_refresh_s: 10
  docker_inspect_cache_s: 30

# System units that the Services page shows (read-only). Add the units that matter on this machine.
old_units:
  - docker.service
  - nvpmodel.service                     # power mode
  - ssh.service                          # remote access

# Processes of an OLD DriverAgent stack on this machine (Services page, read-only; nothing is stopped).
# null = no old stack: the view is empty with the reason "not configured". Example: /home/<user>/driveragent.
old_stack_root: null

history:
  db: data/history.sqlite
  max_mb: 50
  memory_s: 3600           # 1 h at 1 s in memory
  db_step_s: 10            # 24 h at 10 s in SQLite
  db_keep_s: 86400
  cleanup_interval_s: 600

# Power log (dashboard/power_log.py, docs/DASHBOARD_PAGES.md): the INA3221 rails of the 1 s health sample (no second
# read of the sensors) and the events (model set, link, cameras, power mode, control mode) go to one SQLite file.
# 1 s rows for 1 h, 10 s rows for 30 days, day rows for one year. The System page shows it (card "Power log").
power_log:
  db: data/power.sqlite
  enabled: true

limits:
  temp_c: {warn: 70, crit: 85}
  ram_pct: {warn: 80, crit: 90}
  disk_pct: {warn: 80, crit: 90}

nvpmodel_interval_s: 30
mqtt_interval_s: 5
