# AGX inference node (infer/main.py). Paths are absolute or relative to the project root.
# Template: ops/install.sh copies this file to config/infer.yaml (only when that file is missing).
# config/infer.yaml is machine data and is not in git.

sources_config: config/sources.yaml     # ingest (cameras, mode)
models_config: config/models.yaml       # model list (coordinator file); used when there is no last good set
model_store: ~/agx-models               # model store of the controller (controller/store.py; not in git)
start_set: last_good                    # last_good: <model_store>/_state/last_good.json when it has a set, else
                                        # models_config | models_yaml: always models_config
engines_dir: engines                    # new engines are built here (old engines are read-only)
protected_dirs: []                      # folders that are never written (old engines). engines_dir must not be
                                        # inside them. Example: [/home/<user>/model]
proto: proto/agx_infer.capnp            # AgxPerceptionResult + AgxInferStatus + RkCameraInfo, schema version 3
control_config: config/control.yaml     # control mode for the status when <model_store>/_state/catalog.json is missing

ports:
  results: 5560      # ZMQ PUB AgxPerceptionResult (RK3588 connects)
  status: 5561       # ZMQ PUB AgxInferStatus, 1 Hz (RK3588 connects)
  internal: 5562     # ZMQ PUB internal JSON status + JPEG snapshots (dashboard), localhost only
  admin: 5563        # ZMQ REP admin socket (model stop/start, raw frames), localhost only
  rkinfo: 5564       # ZMQ SUB RkCameraInfo, 1 Hz camera names / roles from the RK board (the AGX binds, the board connects a PUB)

bind:
  results: "0.0.0.0"
  status: "0.0.0.0"
  internal: "127.0.0.1"
  admin: "127.0.0.1"   # do not change: the admin socket must not be reachable from the network
  rkinfo: "0.0.0.0"    # peers: only the addresses of the paired boards (data/paired_boards.json; ZAP allowlist)

results:
  sndhwm: 100          # messages per subscriber before ZMQ drops (PUB never blocks)
  queue_max: 1000      # results waiting for the sender thread; more are dropped and counted
  rate_window_s: 5.0

status_period_s: 1.0
status:
  # AgxInferStatus schema version that agx-infer sends: 2 (no power fields) or 3 (power fields).
  # Set 3 only after rk-agxlink on the RK board accepts v3 (rk-agxlink updated and restarted on the board).
  # agx-infer reads this value again when this file changes. You do not restart agx-infer.
  schema_version: 2
snapshot:
  width: 320           # px, JPEG for the dashboard
  period_s: 1.0
  jpeg_quality: 80

admin:
  frame_jpeg_quality: 90

node:
  no_signal_degraded_s: 10.0   # camera NO SIGNAL longer than this while others run -> DEGRADED
  stop_timeout_s: 5.0

log_level: INFO
