# AGX inference node (infer/main.py). Paths are absolute or relative to the project root.

sources_config: config/sources.yaml     # ingest (cameras, mode)
models_config: config/models.yaml       # model list (coordinator file)
engines_dir: engines                    # new engines are built here (old engines are read-only)
proto: proto/agx_infer.capnp            # AgxPerceptionResult + AgxInferStatus, schema version 1

ports:
  results: 5560      # ZMQ PUB AgxPerceptionResult (RK3588 connects)
  status: 5561       # ZMQ PUB AgxInferStatus, 1 Hz (RK3588 connects)
  internal: 5562     # ZMQ PUB internal JSON status + JPEG snapshots (dashboard), localhost only
  admin: 5563        # ZMQ REP admin socket (model stop/start, raw frames), localhost only

bind:
  results: "0.0.0.0"
  status: "0.0.0.0"
  internal: "127.0.0.1"
  admin: "127.0.0.1"   # do not change: the admin socket must not be reachable from the network

results:
  sndhwm: 100          # messages per subscriber before ZMQ drops (PUB never blocks)
  queue_max: 1000      # results waiting for the sender thread; more are dropped and counted
  rate_window_s: 5.0

status_period_s: 1.0
snapshot:
  width: 320           # px, JPEG for the dashboard
  period_s: 1.0
  jpeg_quality: 80

admin:
  frame_jpeg_quality: 90

node:
  no_signal_degraded_s: 10.0   # camera NO SIGNAL longer than this while others run -> DEGRADED
  stop_timeout_s: 5.0

log_level: INFO
