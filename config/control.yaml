# Control mode of the model controller (docs/MODEL_CONTROL_API.md, owner rule M7).
# ONLY THE OWNER CHANGES THIS FILE. No API and no page changes it.
#   bench    the controller accepts build, activate, deactivate and rollback requests
#   vehicle  the controller refuses each of them, with the reason; the active models stay as they are
# A missing file means bench. A value that is not bench or vehicle means: refuse all changes.
control_mode: bench
